name: Downloadable isolated Crest Dev
run-name: Crest Dev • ${{ github.ref_name }}
on:
  workflow_dispatch:
  push:
    branches: ['dev-build/**']
permissions:
  contents: read
concurrency:
  group: crest-macos-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: experimental
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check distribution credentials
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          for key in CERTIFICATE PASSWORD ISSUER KEY_ID PRIVATE_KEY; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing experimental signing/notarization credential: $key. Configure Apple Developer ID and App Store Connect secrets before building."
              exit 1
            fi
          done
      - id: source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
  engine:
    needs: preflight
    uses: ./.github/workflows/chromium-engine.yml
    with:
      source_sha: ${{ needs.preflight.outputs.sha }}
    permissions:
      contents: write
    secrets: inherit
  package:
    needs: [preflight, engine]
    runs-on: ${{ vars.CREST_DEV_MACOS_RUNNER || 'xcode-27' }}
    environment: experimental
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - name: Prepare tools and source
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v rg >/dev/null || brew install ripgrep
          Scripts/control-plane/install-dotnet.sh
          Scripts/bootstrap.sh
      - name: Build and notarize isolated app
        env:
          GH_TOKEN: ${{ github.token }}
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: bash Scripts/control-plane/build-dev-distribution.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Crest-Dev-arm64-${{ github.run_id }}
          path: ${{ runner.temp }}/crest-dev/publish/*
          if-no-files-found: error
          retention-days: 14
      - name: Clean build products
        if: always()
        run: rm -rf "$RUNNER_TEMP/crest-dev"
